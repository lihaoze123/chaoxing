[project]
name = "chaoxing"
version = "0.1.0"
description = "超星课程学习命令行工具"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "httpx[socks]>=0.28.1",
    "pyaes>=1.6.1",
    "pydantic>=2.12,<3",
    "rich>=14.1",
    "typer>=0.19",
]

[project.scripts]
chaoxing = "chaoxing.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["config.example.toml", "tests/*.py", "uv.lock", ".python-version"]

[project.optional-dependencies]
ocr = ["ddddocr>=1.6.1"]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14.0", "ty>=0.0.1a0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.terminal]
error-on-warning = true
